<section class="py-5 mt-5">
  <div class="container">

    <div class="row justify-content-center align-items-center">

      <div class="col-lg-6">

        <div class="text-center mb-4">

          <i class="bi bi-shield-lock display-3 text-primary"></i>

          <h1 class="fw-bold mt-3">
            ¿Olvidaste tu contraseña?
          </h1>

          <p class="text-muted">
            No te preocupes. Ingresa el correo con el que registraste tu cuenta
            y te enviaremos un enlace para restablecer tu contraseña.
          </p>

        </div>

        <div class="card shadow-lg border-0 rounded-4">

          <div class="card-body p-4">

            <!-- Cargando -->
            <div
              *ngIf="loading"
              class="alert alert-info d-flex align-items-center">

              <div
                class="spinner-border spinner-border-sm me-2"
                role="status">
              </div>

              Enviando solicitud...

            </div>

            <!-- Éxito -->
            <div
              *ngIf="successMessage"
              class="alert alert-success alert-dismissible fade show">

              <i class="bi bi-check-circle-fill me-2"></i>

              {{ successMessage }}

              <button
                class="btn-close"
                (click)="successMessage=''">
              </button>

            </div>

            <!-- Error -->
            <div
              *ngIf="errorMessage"
              class="alert alert-danger alert-dismissible fade show">

              <i class="bi bi-exclamation-triangle-fill me-2"></i>

              {{ errorMessage }}

              <button
                class="btn-close"
                (click)="errorMessage=''">
              </button>

            </div>

            <form (ngSubmit)="sendEmail()">

              <div class="mb-4">

                <label class="form-label fw-semibold">
                  Correo electrónico
                </label>

                <div class="input-group">

                  <span class="input-group-text">
                    <i class="bi bi-envelope-fill"></i>
                  </span>

                  <input
                    type="email"
                    class="form-control"
                    placeholder="correo@ejemplo.com"
                    [(ngModel)]="email"
                    name="email"
                    required
                    email>

                </div>

              </div>

              <button
                class="btn btn-primary w-100"
                type="submit"
                [disabled]="loading">

                <span
                  *ngIf="loading"
                  class="spinner-border spinner-border-sm me-2">
                </span>

                <i
                  *ngIf="!loading"
                  class="bi bi-send-fill me-2">
                </i>

                {{ loading ? 'Enviando...' : 'Enviar enlace de recuperación' }}

              </button>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>
</section>
