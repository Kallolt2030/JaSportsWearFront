<section class="bg-dark min-vh-100 py-5 mt-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-10">

            <div class="card shadow-lg border-0">

                <div class="card-body p-4">

                <!-- Logo -->
                <div class="text-center mb-4">
                    <img src="imgs/sportsWear.png" class="img-fluid mb-3" style="max-width:120px;">
                    <h2 class="fw-bold">JASPORTWEAR</h2>
                    <p class="text-muted">
                    {{ isRegister ? 'Crear cuenta' : 'Iniciar sesión' }}
                    </p>
                </div>

                <!-- MENSAJES -->

                <div
                    *ngIf="successMessage"
                    class="alert alert-success alert-dismissible fade show">

                    <i class="bi bi-check-circle-fill me-2"></i>

                    {{successMessage}}

                    <button
                    class="btn-close"
                    (click)="successMessage=null">
                    </button>

                </div>

                <div
                    *ngIf="errorMessage"
                    class="alert alert-danger alert-dismissible fade show">

                    <i class="bi bi-exclamation-triangle-fill me-2"></i>

                    {{errorMessage}}

                    <button
                    class="btn-close"
                    (click)="errorMessage=null">
                    </button>

                </div>

                <!-- LOGIN -->

                <form
                    *ngIf="!isRegister"
                    #loginForm="ngForm"
                    (ngSubmit)="login()">

                    <!-- EMAIL -->

                    <div class="mb-3">

                    <label class="form-label">

                        <i class="bi bi-envelope-fill"></i>

                        Correo electrónico

                    </label>

                    <input
                        class="form-control"
                        type="email"
                        name="email"
                        [(ngModel)]="email"
                        required
                        email
                        #loginEmail="ngModel"
                        [class.is-invalid]="loginEmail.invalid && loginEmail.touched">

                    <div class="invalid-feedback">

                        Ingresa un correo válido.

                    </div>

                    </div>

                    <!-- PASSWORD -->

                    <div class="mb-3">

                    <label class="form-label">

                        <i class="bi bi-lock-fill"></i>

                        Contraseña

                    </label>

                    <div class="input-group">

                        <input

                        class="form-control"

                        [type]="showPassword ? 'text':'password'"

                        name="password"

                        [(ngModel)]="password"

                        required

                        minlength="8"

                        #loginPassword="ngModel"

                        [class.is-invalid]="loginPassword.invalid && loginPassword.touched">

                        <button
                        class="btn btn-outline-secondary"
                        type="button"
                        (click)="togglePassword()">

                        <i
                            class="bi"
                            [class.bi-eye]="!showPassword"
                            [class.bi-eye-slash]="showPassword">
                        </i>

                        </button>

                    </div>

                    <div class="invalid-feedback d-block"
                        *ngIf="loginPassword.touched && loginPassword.errors?.['required']">

                        La contraseña es obligatoria.

                    </div>

                    <div class="invalid-feedback d-block"
                        *ngIf="loginPassword.touched && loginPassword.errors?.['minlength']">

                        Debe tener al menos 8 caracteres.

                    </div>

                    </div>

                    <button
                    class="btn btn-primary w-100"
                    [disabled]="isLoading">

                    <span *ngIf="!isLoading">

                        <i class="bi bi-box-arrow-in-right me-2"></i>

                        Iniciar sesión

                    </span>

                    <span *ngIf="isLoading">

                        <span class="spinner-border spinner-border-sm me-2"></span>

                        Iniciando...

                    </span>

                    </button>

                    <div class="text-center mt-3">

                    <a
                        routerLink="/forgot-password"
                        class="text-decoration-none">

                        ¿Olvidaste tu contraseña?

                    </a>

                    </div>

                </form>

                <!-- REGISTRO -->

                <form
                    *ngIf="isRegister"
                    #registerForm="ngForm"
                    (ngSubmit)="register()">

                    <div class="mb-3">

                    <label class="form-label">

                        Nombre

                    </label>

                    <input
                        class="form-control"
                        type="text"
                        name="name"
                        [(ngModel)]="newUser.name"
                        required
                        minlength="2"
                        #name="ngModel"
                        [class.is-invalid]="name.invalid && name.touched">

                    <div class="invalid-feedback">

                        Ingresa tu nombre.

                    </div>

                    </div>

                    <div class="mb-3">

                    <label class="form-label">

                        Correo

                    </label>

                    <input
                        class="form-control"
                        type="email"
                        name="emailReg"
                        [(ngModel)]="newUser.email"
                        required
                        email
                        #emailReg="ngModel"
                        [class.is-invalid]="emailReg.invalid && emailReg.touched">

                    <div class="invalid-feedback">

                        Correo inválido.

                    </div>

                    </div>

                    <!-- PASSWORD -->

                    <div class="mb-3">

                    <label class="form-label">

                        Contraseña

                    </label>

                    <div class="input-group">

                        <input

                        class="form-control"

                        [type]="showRegisterPassword ? 'text':'password'"

                        name="passwordReg"

                        [(ngModel)]="newUser.password"

                        minlength="8"

                        required

                        #passwordReg="ngModel"

                        [class.is-invalid]="passwordReg.invalid && passwordReg.touched">

                        <button
                        class="btn btn-outline-secondary"
                        type="button"
                        (click)="toggleRegisterPassword()">

                        <i
                            class="bi"
                            [class.bi-eye]="!showRegisterPassword"
                            [class.bi-eye-slash]="showRegisterPassword">
                        </i>

                        </button>

                    </div>

                    </div>

                    <!-- CONFIRMAR -->

                    <div class="mb-3">

                    <label class="form-label">

                        Confirmar contraseña

                    </label>

                    <div class="input-group">

                        <input

                        class="form-control"

                        [type]="showConfirmPassword ? 'text':'password'"

                        name="confirmPassword"

                        [(ngModel)]="newUser.confirmPassword"

                        required>

                        <button
                        class="btn btn-outline-secondary"
                        type="button"
                        (click)="toggleConfirmPassword()">

                        <i
                            class="bi"
                            [class.bi-eye]="!showConfirmPassword"
                            [class.bi-eye-slash]="showConfirmPassword">
                        </i>

                        </button>

                    </div>

                    <div
                        class="invalid-feedback d-block"
                        *ngIf="newUser.confirmPassword &&
                            newUser.password!=newUser.confirmPassword">

                        Las contraseñas no coinciden.

                    </div>

                    </div>

                    <button
                    class="btn btn-success w-100"
                    [disabled]="isLoading">

                    <span *ngIf="!isLoading">

                        <i class="bi bi-person-plus-fill me-2"></i>

                        Registrarme

                    </span>

                    <span *ngIf="isLoading">

                        <span class="spinner-border spinner-border-sm me-2"></span>

                        Registrando...

                    </span>

                    </button>

                </form>

                <hr>

                <div class="text-center">

                    <button
                    class="btn btn-link text-decoration-none"
                    (click)="toggleForm()">

                    {{isRegister ?
                    '¿Ya tienes cuenta? Inicia sesión'
                    :
                    '¿No tienes cuenta? Regístrate'}}

                    </button>

                </div>

                </div>

            </div>

            </div>
        </div>
    </div>
</section>
