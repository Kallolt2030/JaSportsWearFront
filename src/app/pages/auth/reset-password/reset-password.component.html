<section class="py-5 mt-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="text-center mb-4">

                    <i class="bi bi-key-fill display-3 text-primary"></i>

                    <h1 class="fw-bold mt-3">
                        Restablecer contraseña
                    </h1>

                    <p class="text-muted">
                        Ingresa una nueva contraseña segura para continuar con tu cuenta.
                    </p>

                </div>

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-4">

                        <!-- Cargando -->
                        <div
                            *ngIf="loading"
                            class="alert alert-info d-flex align-items-center">

                            <div
                                class="spinner-border spinner-border-sm me-2"
                                role="status">
                            </div>

                            Actualizando contraseña...

                        </div>

                        <!-- Éxito -->
                        <div
                            *ngIf="successMessage"
                            class="alert alert-success alert-dismissible fade show">

                            <i class="bi bi-check-circle-fill me-2"></i>

                            {{ successMessage }}

                            <button
                                type="button"
                                class="btn-close"
                                (click)="successMessage=''">
                            </button>

                        </div>

                        <!-- Error -->
                        <div
                            *ngIf="errorMessage"
                            class="alert alert-danger alert-dismissible fade show">

                            <i class="bi bi-exclamation-triangle-fill me-2"></i>

                            {{ errorMessage }}

                            <button
                                type="button"
                                class="btn-close"
                                (click)="errorMessage=''">
                            </button>

                        </div>

                        <form (ngSubmit)="resetPassword()">

                            <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Nueva contraseña
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock-fill"></i>
                                </span>

                                <input
                                    [type]="showPassword ? 'text' : 'password'"
                                    class="form-control"
                                    [(ngModel)]="password"
                                    name="password"
                                    minlength="8"
                                    required>

                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    (click)="showPassword = !showPassword">

                                    <i
                                        class="bi"
                                        [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'">
                                    </i>

                                </button>

                            </div>

                        </div>

                            <div class="mb-4">

                                <label class="form-label fw-semibold">
                                    Confirmar contraseña
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-shield-lock-fill"></i>
                                    </span>

                                    <input
                                        [type]="showConfirmPassword ? 'text' : 'password'"
                                        class="form-control"
                                        [(ngModel)]="password_confirmation"
                                        name="password_confirmation"
                                        minlength="8"
                                        required>

                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        (click)="showConfirmPassword = !showConfirmPassword">

                                        <i
                                            class="bi"
                                            [ngClass]="showConfirmPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'">
                                        </i>

                                    </button>

                                </div>

                            </div>

                            <button
                                class="btn btn-primary w-100"
                                type="submit"
                                [disabled]="loading">

                                <span
                                    *ngIf="loading"
                                    class="spinner-border spinner-border-sm me-2">
                                </span>

                                <i
                                    *ngIf="!loading"
                                    class="bi bi-check2-circle me-2">
                                </i>

                                {{ loading ? 'Guardando...' : 'Cambiar contraseña' }}

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
